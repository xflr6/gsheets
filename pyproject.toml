[project]
name = "gsheets"
authors = [{ name = "Sebastian Bank", email = "sebastian.bank@uni-leipzig.de" }]
description = "Pythonic wrapper for the Google Sheets API"
keywords = ["spreadhseets", "google", "api", "v4", "wrapper", "csv", "pandas"]
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["google-api-python-client", "oauth2client>=1.5.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://github.com/xflr6/gsheets"
Documentation = "https://gsheets.readthedocs.io"
Changelog = "https://gsheets.readthedocs.io/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/xflr6/gsheets/issues"
CI = "https://github.com/xflr6/gsheets/actions"
Coverage = "https://app.codecov.io/gh/xflr6/gsheets"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
platforms = ["any"]

[tool.setuptools.dynamic]
version = { attr = "gsheets.__version__" }

[dependency-groups]
dev = [  # $ pip install -e . --group dev
  "build", "tox", "twine", "wheel",
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
docs = ["sphinx", "sphinx-rtd-theme"]
lint = ["flake8", "Flake8-pyproject", "pep8-naming"]
test = ["coverage", "mock>=4", "pytest>=8", "pytest-cov", "pytest-mock>=3"]
typing = ["mypy"]

[tool.mypy]
packages = ["gsheets"]

[tool.flake8]
exclude = [".tox", "build", "docs"]
ignore = ["E126", "E128", "W503"]
max-line-length = 100

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["gsheets", "tests"]
addopts = [
  "--doctest-modules",
  "--doctest-glob='*.rst'", "--ignore=docs/conf.py",
  "--cov", "--cov-report=term", "--cov-report=html",
  "--strict-config", "--strict-markers",
]
mock_use_standalone_module = true
log_cli_level = "WARNING"
log_file = "test-log.txt"
log_file_level = "DEBUG"

[tool.coverage.run]
source = ["gsheets"]
branch = false

[tool.tox]
requires = ["tox>=4.22"]
env_list = ["3.14", "3.13", "3.12", "3.11", "3.10"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
dependency_groups = ["test"]
commands = [["python", "-X", "dev", "run-tests.py", { replace = "posargs", extend = true }]]
